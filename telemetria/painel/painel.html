<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetria de Agentes</title>
<style>
:root{--bg:#0b0d10;--card:#13161b;--line:#232830;--tx:#e7e9ee;--mut:#8b93a1;--amb:#E2A23B;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--sky:#38bdf8}
body.light{--bg:#f6f4ef;--card:#fff;--line:#e3ded3;--tx:#1d1f23;--mut:#666d78;--amb:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:var(--amb)}
header .st{color:var(--mut);font-size:12px;margin-left:auto}
nav{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{color:var(--amb);border-color:var(--amb)}
main{padding:16px;max-width:1200px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 4px;font-size:15px}
.mut{color:var(--mut);font-size:12px}
.selo{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid}
.s-processando{color:var(--ok);border-color:var(--ok)}
.s-esperando-você,.s-pede-permissão{color:var(--warn);border-color:var(--warn)}
.s-parada{color:var(--err);border-color:var(--err)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:500}
h2{font-size:15px;color:var(--amb);margin:18px 0 8px}
.bar{height:8px;background:var(--amb);border-radius:4px;min-width:2px}
.vazio{color:var(--mut);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
code{font-family:"JetBrains Mono",monospace;font-size:12px}
.wrap{overflow-x:auto}
#tema{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 8px;cursor:pointer}
.card[data-id]{cursor:pointer;transition:border-color .15s}
.card[data-id]:hover{border-color:var(--amb)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:10;overflow-y:auto}
#modal.on{display:flex}
#modal .caixa{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:1000px;padding:16px 18px}
#modal .topo{display:flex;align-items:flex-start;gap:10px}
#modal .topo h2{margin:0;font-size:17px;flex:1}
#modal .topo button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.dl dt{color:var(--mut)}.dl dd{margin:0;word-break:break-all}
.dia{font-size:13px;color:var(--mut);margin:14px 0 6px}
.dia::first-letter{text-transform:uppercase}
tr.perto td{background:rgba(226,162,59,.08)}
</style>
</head>
<body>
<header>
  <h1>📡 Telemetria de Agentes</h1>
  <span class="mut">Claude Code + Codex · local</span>
  <span class="st" id="st">carregando…</span>
  <button id="tema" title="claro/escuro">🌙</button>
</header>
<nav id="abas"></nav>
<main id="conteudo"></main>
<div id="modal"><div class="caixa" id="modalCaixa"></div></div>
<script>
const ABAS=[["agora","Agora"],["rotinas","Rotinas"],["agenda","Agenda"],["processamentos","Processamentos"],["consumo","Consumo"],["falhas","Falhas"],["uso","Uso (7 dias)"],["historico","Histórico"],["saude","Saúde"]];
let aba=(()=>{try{return localStorage.getItem("aba")||"agora"}catch(e){return "agora"}})();
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=s=>{if(s==null)return"—";s=Math.round(s);if(s<60)return s+" s";if(s<3600)return Math.floor(s/60)+" min";const h=Math.floor(s/3600);return h<48?h+" h "+Math.floor(s%3600/60)+" min":Math.floor(h/24)+" d"};
const hora=t=>new Date(t*1000).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function tabela(cols,rows){if(!rows.length)return'<div class="vazio">Nada por aqui.</div>';return'<div class="wrap"><table><tr>'+cols.map(c=>"<th>"+c[0]+"</th>").join("")+"</tr>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+c[1](r)+"</td>").join("")+"</tr>").join("")+"</table></div>"}
function barras(rows){const m=Math.max(1,...rows.map(r=>r.n));return tabela([["Nome",r=>esc(r.nome)],["Usos",r=>r.n],["",r=>'<div class="bar" style="width:'+(100*r.n/m)+'%"></div>']],rows)}
const quando=t=>{if(!t)return"—";const d=new Date(t*1000),h=new Date();const dia=d.toDateString()===h.toDateString()?"hoje":(d-h<2*864e5&&d>h&&d.getDate()===new Date(+h+864e5).getDate()?"amanhã":d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}));return dia+" "+hora(t)};
const R={
agenda(d){const ate=d.agora,prox=d.previstos;let h='<div class="kpis">'+[["Disparos previstos ("+d.horas+" h)",prox.length],["Próxima hora",prox.filter(r=>r.quando-ate<3600).length],["Próximas 3 h",prox.filter(r=>r.quando-ate<3*3600).length],["Recorrentes (≤ 1 h)",d.recorrentes.length]].map(k=>'<div class="kpi"><b>'+k[1]+"</b><span>"+k[0]+"</span></div>").join("")+"</div>";
 if(!prox.length)h+='<div class="vazio">Nada previsto nas próximas '+d.horas+" h.</div>";
 const dias={};prox.forEach(r=>{const k=new Date(r.quando*1000).toDateString();(dias[k]=dias[k]||[]).push(r)});
 for(const k in dias){const d0=new Date(k);h+='<div class="dia">'+(d0.toDateString()===new Date().toDateString()?"hoje":d0.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"}))+" · "+dias[k].length+" disparo(s)</div>";
  h+='<div class="wrap"><table><tr><th>Hora</th><th>Em</th><th>Projeto</th><th>O quê</th><th>Regra</th></tr>'+dias[k].map(r=>'<tr class="'+(r.quando-ate<3600?"perto":"")+'"><td><b>'+hora(r.quando)+'</b></td><td class="mut">'+dur(r.quando-ate)+"</td><td><b>"+esc(r.projeto||"—")+"</b></td><td><code>"+esc(r.unidade)+'</code><div class="mut">'+esc(r.o_que)+'</div></td><td class="mut" style="white-space:nowrap">'+esc(r.regra||r.fonte)+"</td></tr>").join("")+"</table></div>"}
 return h+'<details style="margin-top:14px"'+(window._rec?" open":"")+' ontoggle="window._rec=this.open"><summary>Recorrentes (a cada 1 h ou menos) e regras sem previsão calculada ('+d.recorrentes.length+")</summary>"+tabela([["Regra",r=>esc(r.regra||"")],["Próxima",r=>r.proxima?quando(r.proxima):"—"],["Projeto",r=>"<b>"+esc(r.projeto||"—")+"</b>"],["O quê",r=>"<code>"+esc(r.unidade)+'</code><div class="mut">'+esc(r.o_que)+"</div>"]],d.recorrentes)+"</details>"},
rotinas(d){const ag=d.agendados,ate=d.agora,runs=d.rodando.filter(r=>r.run),svc=d.rodando.filter(r=>!r.run);return'<div class="kpis">'+[["Runs rodando",runs.length],["Serviços ligados",svc.length],["Agendados",ag.length],["Próximas 3 h",ag.filter(r=>r.proxima&&r.proxima-ate<3*3600).length]].map(k=>'<div class="kpi"><b>'+k[1]+"</b><span>"+k[0]+"</span></div>").join("")+"</div><h2>Runs rodando agora</h2>"+tabela([["Desde",r=>quando(r.desde)+' <span class="mut">('+dur(r.ha_s)+")</span>"],["Projeto",r=>"<b>"+esc(r.projeto||"—")+"</b>"+(r.sessao_titulo?'<div class="mut">'+esc(r.sessao_titulo)+"</div>":"")],["O quê",r=>"<code>"+esc(r.unidade)+'</code><div class="mut">'+esc(r.comando)+"</div>"]],runs)+'<details style="margin-top:14px"'+(window._svc?" open":"")+' ontoggle="window._svc=this.open"><summary>Serviços sempre ligados ('+svc.length+")</summary>"+tabela([["Desde",r=>quando(r.desde)],["Projeto",r=>"<b>"+esc(r.projeto||"—")+"</b>"],["O quê",r=>"<code>"+esc(r.unidade)+'</code><div class="mut">'+esc(r.o_que)+"</div>"]],svc)+"</details>"+"<h2>Agendados</h2>"+tabela([["Próxima",r=>"<b>"+quando(r.proxima)+"</b>"+(r.proxima?' <span class="mut">(em '+dur(r.proxima-ate)+")</span>":"")],["Projeto",r=>"<b>"+esc(r.projeto||"—")+"</b>"],["O quê",r=>"<code>"+esc(r.unidade)+"</code>"+(r.rodando_agora?' <span class="selo s-processando">rodando</span>':"")+'<div class="mut">'+esc(r.o_que)+"</div>"],["Última",r=>r.fonte==="cron"?'<span class="mut">cron</span>':quando(r.ultima)]],ag)},
agora(d){const c=d.contagem;let h='<div class="kpis">'+[["Ativas",d.total],["Processando",c["processando"]||0],["Esperando você",(c["esperando você"]||0)+(c["pede permissão"]||0)],["Paradas",c["parada"]||0],["Abertas sem sinal ainda",d.sem_sinal||0]].map(k=>'<div class="kpi"><b>'+k[1]+"</b><span>"+k[0]+"</span></div>").join("")+"</div>";
 if(!d.sessoes.length)return h+'<div class="vazio">Nenhuma sessão registrada ainda. Sessões abertas antes da instalação só aparecem depois de reabertas.</div>';
 const ordem={"pede permissão":0,"esperando você":1,"parada":2,"processando":3};
 d.sessoes.sort((a,b)=>ordem[a.selo]-ordem[b.selo]);
 return h+'<div class="grid">'+d.sessoes.map(s=>'<div class="card" data-id="'+esc(s.id)+'" title="clique para ver tudo desta sessão"><h3>'+esc(s.projeto||"?")+(s.repo&&s.repo!==s.projeto?' <span class="mut">→ '+esc(s.repo)+'</span>':'')+' <span class="selo s-'+s.selo.replace(/ /g,"-")+'">'+s.selo+'</span></h3>'+(s.titulo?'<div style="font-weight:600;margin:2px 0 4px">'+esc(s.titulo)+'</div>':'')+'<div class="mut">'+[s.origem,s.modelo,"sessão "+s.sessao].filter(Boolean).map(esc).join(" · ")+'</div><div style="margin-top:6px">registrada há '+dur(s.desde_s)+" · último sinal há "+dur(s.ultimo_s)+"</div><div>última: <code>"+esc(s.ultima||"—")+"</code>"+(s.subagentes?" · "+s.subagentes+" subagente(s)":"")+"</div>"+s.rodando.map(r=>'<div class="mut">▶ <code>'+esc(r.o_que)+"</code> há "+dur(r.ha_s)+(r.subagente?" (subagente)":"")+"</div>").join("")+"</div>").join("")+"</div>"},
processamentos(d){return"<h2>Rodando agora</h2>"+tabela([["O quê",r=>"<code>"+esc(r.programa||r.ferramenta)+"</code>"],["Projeto",r=>esc(r.projeto)],["Há",r=>dur(r.ha_s)],["Subagente",r=>r.agente?"sim":""]],d.rodando)+"<h2>Concluídos hoje (≥ 30 s)</h2>"+tabela([["Hora",r=>hora(r.ts)],["O quê",r=>"<code>"+esc(r.programa||r.ferramenta)+"</code>"],["Projeto",r=>esc(r.projeto)],["Duração",r=>dur(r.duracao_ms/1000)],["Resultado",r=>r.status==="erro"?'<span style="color:var(--err)">'+esc(r.erro_tipo)+"</span>":"ok"]],d.longos_hoje)},
consumo(d){const n=x=>x==null?"—":x>=1e6?(x/1e6).toFixed(1)+" M":x>=1e3?(x/1e3).toFixed(1)+" mil":x;const usd=x=>x?"US$ "+Number(x).toFixed(2):"—";const cols=[["Fonte",r=>esc(r.fonte)],["Chamadas",r=>r.chamadas],["Entrada",r=>n(r.entrada)],["Saída",r=>n(r.saida)],["Cache lido",r=>n(r.cache_leitura)],["Cache criado",r=>n(r.cache_escrita)],["Custo estimado",r=>usd(r.custo_usd)]];
 return '<p class="mut">Custo = estimativa em preço de API (só Claude Code; o Codex não informa preço). Na assinatura quem manda é o plano.</p><h2>Hoje</h2>'+tabela(cols,d.hoje)+"<h2>Por modelo (7 dias)</h2>"+tabela([["Modelo",r=>esc(r.modelo)]].concat(cols),d.modelos_7d)+"<h2>Por projeto (hoje)</h2>"+tabela([["Projeto",r=>esc(r.projeto)]].concat(cols),d.projetos_hoje)+"<h2>Por dia (30 dias)</h2>"+tabela([["Dia",r=>r.dia]].concat(cols),d.dias)},
falhas(d){return"<h2>Taxa de falha hoje</h2>"+tabela([["Alvo",r=>"<code>"+esc(r.alvo)+"</code>"],["Chamadas",r=>r.total],["Erros",r=>r.erros],["Taxa",r=>'<span style="color:'+(r.taxa>=30?"var(--err)":"var(--warn)")+'">'+r.taxa+"%</span>"]],d.taxa)+"<h2>Erros hoje por tipo</h2>"+tabela([["Alvo",r=>"<code>"+esc(r.alvo)+"</code>"],["Programa",r=>esc(r.programa||"")],["Tipo",r=>esc(r.erro_tipo)],["Vezes",r=>r.n],["Último",r=>hora(r.ultima)]],d.por_alvo)},
uso(d){return"<h2>Skills</h2>"+barras(d.skills)+"<h2>Servidores MCP</h2>"+barras(d.mcps)+"<h2>Subagentes</h2>"+barras(d.subagentes)+"<h2>Ferramentas</h2>"+barras(d.ferramentas)+"<h2>Programas no Bash</h2>"+barras(d.programas)+"<h2>Projetos</h2>"+barras(d.projetos)},
historico(d){const m=Math.max(1,...d.dias.map(r=>r.chamadas||0));return"<h2>Últimos 30 dias</h2>"+tabela([["Dia",r=>r.dia],["Sessões",r=>r.sessoes],["Pedidos",r=>r.pedidos],["Chamadas",r=>r.chamadas],["Falhas",r=>r.falhas],["",r=>'<div class="bar" style="width:'+(100*(r.chamadas||0)/m)+'%"></div>']],d.dias.slice().reverse())},
saude(d){return'<div class="kpis">'+[["Último evento",d.ultimo_evento_s==null?"—":"há "+dur(d.ultimo_evento_s)],["Eventos guardados",d.eventos],["Sessões",d.sessoes],["Banco",d.banco_mb+" MB"],["Hooks",d.hooks_instalados.length+" eventos"]].map(k=>'<div class="kpi"><b>'+k[1]+"</b><span>"+k[0]+"</span></div>").join("")+"</div><h2>Eventos por hora (24 h)</h2>"+tabela([["Hora",r=>r.hora+"h"],["Eventos",r=>r.n]],d.por_hora)+'<p class="mut">Hooks: '+esc(d.hooks_instalados.join(", ")||"nenhum")+"<br>Banco: <code>"+esc(d.banco)+"</code></p>"}
};
const num=x=>x==null?"—":x>=1e6?(x/1e6).toFixed(1)+" M":x>=1e3?(x/1e3).toFixed(1)+" mil":x;
const dataHora=t=>t?new Date(t*1000).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
let sessaoAberta=null;
function desenhaSessao(d){const s=d.sessao,t=d.totais||{},p=d.processo;
 const dl=pares=>'<dl class="dl">'+pares.filter(x=>x[1]!=null&&x[1]!=="").map(x=>"<dt>"+x[0]+"</dt><dd>"+x[1]+"</dd>").join("")+"</dl>";
 const cons=d.consumo.reduce((a,r)=>{for(const k of["entrada","saida","cache_leitura","cache_escrita","custo_usd"])a[k]=(a[k]||0)+(r[k]||0);return a},{});
 let h='<div class="topo"><h2>'+esc(d.titulo||s.projeto||"Sessão")+'<div class="mut" style="font-weight:400">'+esc(s.projeto||"?")+(s.repo&&s.repo!==s.projeto?" → "+esc(s.repo):"")+'</div></h2><button id="mAtualiza" title="atualizar">↻</button><button id="mFecha" title="fechar (Esc)">✕</button></div>';
 h+='<div class="kpis" style="margin-top:12px">'+[["Pedidos",t.pedidos||0],["Chamadas",t.chamadas||0],["Erros",t.erros||0],["Subagentes",t.subagentes||0],["Tempo em ferramentas",dur((t.duracao_ms||0)/1000)],["Custo estimado",cons.custo_usd?"US$ "+cons.custo_usd.toFixed(2):"—"]].map(k=>'<div class="kpi"><b>'+k[1]+"</b><span>"+k[0]+"</span></div>").join("")+"</div>";
 h+=dl([["Sessão","<code>"+esc(s.sessao)+"</code>"],["Estado",esc(s.estado)+(d.vivo===false?' <span class="selo s-parada">processo encerrado</span>':"")],["Origem",esc(s.origem)],["Modelo",esc(s.modelo)],["Início",dataHora(s.inicio)+' <span class="mut">(há '+dur(d.agora-s.inicio)+")</span>"],["Último sinal",dataHora(s.ultimo_ts)+' <span class="mut">(há '+dur(d.agora-s.ultimo_ts)+") · "+esc(s.ultimo_evento)+"</span>"],["Última ferramenta","<code>"+esc(s.ultima_ferramenta||"—")+"</code>"],["PID",s.pid?String(s.pid)+(p&&p.rss_mb!=null?' <span class="mut">· '+p.rss_mb+" MB de RAM</span>":""):null],["Pasta",p&&p.cwd?"<code>"+esc(p.cwd)+"</code>":null],["Comando",p&&p.cmd?"<code>"+esc(p.cmd)+"</code>":null],["Transcript",d.transcript?"<code>"+esc(d.transcript)+"</code>"+(d.transcript_mb!=null?' <span class="mut">('+d.transcript_mb+" MB)</span>":""):null],["Eventos guardados",t.eventos]]);
 if(d.rodando.length)h+="<h2>Rodando agora</h2>"+tabela([["O quê",r=>"<code>"+esc(r.programa||r.ferramenta)+"</code>"],["Há",r=>dur(r.ha_s)],["Subagente",r=>r.agente?"sim":""]],d.rodando);
 h+="<h2>Consumo por modelo</h2>"+tabela([["Modelo",r=>esc(r.modelo)],["Chamadas",r=>r.chamadas],["Entrada",r=>num(r.entrada)],["Saída",r=>num(r.saida)],["Cache lido",r=>num(r.cache_leitura)],["Cache criado",r=>num(r.cache_escrita)],["Custo",r=>r.custo_usd?"US$ "+Number(r.custo_usd).toFixed(2):"—"]],d.consumo);
 h+="<h2>Ferramentas</h2>"+tabela([["Ferramenta",r=>"<code>"+esc(r.nome)+"</code>"],["Usos",r=>r.n],["Erros",r=>r.erros?'<span style="color:var(--err)">'+r.erros+"</span>":0],["Tempo",r=>dur(r.seg)]],d.ferramentas);
 const lista=(tit,rows)=>rows.length?"<h2>"+tit+"</h2>"+barras(rows):"";
 h+=lista("Programas no Bash",d.programas)+lista("Skills",d.skills)+lista("Servidores MCP",d.mcps)+lista("Subagentes",d.subagentes);
 if(d.erros.length)h+="<h2>Erros</h2>"+tabela([["Quando",r=>dataHora(r.ts)],["Alvo",r=>"<code>"+esc(r.alvo)+"</code>"],["Programa",r=>esc(r.programa||"")],["Tipo",r=>'<span style="color:var(--err)">'+esc(r.erro_tipo)+"</span>"]],d.erros);
 h+="<h2>Últimos eventos</h2>"+tabela([["Hora",r=>dataHora(r.ts)],["Evento",r=>esc(r.evento)+(r.agente?' <span class="mut">(sub)</span>':"")],["O quê",r=>"<code>"+esc([r.ferramenta,r.programa||r.skill||r.mcp||r.tipo_agente].filter(Boolean).join(" · ")||r.detalhe||"")+"</code>"],["Duração",r=>r.duracao_ms!=null?dur(r.duracao_ms/1000):""],["Status",r=>r.status==="erro"?'<span style="color:var(--err)">'+esc(r.erro_tipo||"erro")+"</span>":esc(r.status||"")]],d.eventos);
 return h}
async function abreSessao(id){sessaoAberta=id;$("#modal").classList.add("on");if(!$("#modalCaixa").innerHTML)$("#modalCaixa").innerHTML='<div class="mut">carregando…</div>';
 try{const r=await fetch("/api/sessao?id="+encodeURIComponent(id));const d=await r.json();if(!r.ok||d.erro)throw new Error(d.erro||r.status);if(sessaoAberta!==id)return;$("#modalCaixa").innerHTML=desenhaSessao(d)}catch(e){$("#modalCaixa").innerHTML='<div class="topo"><h2>Erro</h2><button id="mFecha">✕</button></div><p>'+esc(e.message)+"</p>"}}
function fechaSessao(){sessaoAberta=null;$("#modal").classList.remove("on");$("#modalCaixa").innerHTML=""}
$("#conteudo").addEventListener("click",e=>{const c=e.target.closest(".card[data-id]");if(c)abreSessao(c.dataset.id)});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"||e.target.id==="mFecha")fechaSessao();else if(e.target.id==="mAtualiza")abreSessao(sessaoAberta)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sessaoAberta)fechaSessao()});
function desenhaAbas(){$("#abas").innerHTML=ABAS.map(a=>'<button data-a="'+a[0]+'" class="'+(a[0]===aba?"on":"")+'">'+a[1]+"</button>").join("")}
$("#abas").onclick=e=>{const a=e.target.dataset.a;if(!a)return;aba=a;try{localStorage.setItem("aba",a)}catch(_){}desenhaAbas();carrega()};
async function carrega(){try{const r=await fetch("/api/"+aba);const d=await r.json();if(!r.ok)throw new Error(d.erro||r.status);$("#conteudo").innerHTML=R[aba](d);$("#st").textContent="atualizado "+new Date().toLocaleTimeString("pt-BR")}catch(e){$("#st").textContent="erro: "+e.message}}
$("#tema").onclick=()=>{document.body.classList.toggle("light");try{localStorage.setItem("tema",document.body.classList.contains("light")?"light":"dark")}catch(_){}};
try{if(localStorage.getItem("tema")==="light")document.body.classList.add("light")}catch(_){}
desenhaAbas();carrega();setInterval(()=>{if(!document.hidden)carrega()},5000);
</script>
</body>
</html>
